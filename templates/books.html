<h2>Books</h2>

<form action="/add_book" method="post">
    Title: <input name="title">
    Author: <input name="author">
    <button type="submit">Add Book</button>
</form>

<table border="1">
<tr><th>ID</th><th>Title</th><th>Author</th><th>Available</th></tr>
{% for b in books %}
<tr>
<td>{{b[0]}}</td>
<td>{{b[1]}}</td>
<td>{{b[2]}}</td>
<td>{{b[3]}}</td>
</tr>
{% endfor %}
</table>

<a href="/">Back</a>
